<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}" data-page="gate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{COUPLE}} · Photos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Decorative artwork a theme can draw (see THEMES in src/worker.js). */
    .theme-scene { display: none; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #faf9f7;
      --bg-card: #ffffff;
      --bg-input: #fafafa;
      --text-primary: #1a1a1a;
      --text-secondary: #888;
      --text-tertiary: #aaa;
      --border: #ebebeb;
      --border-strong: #ddd;
      --accent-bg: #EEEDFE;
      --accent-border: #AFA9EC;
      --accent-text: #3C3489;
      --accent-btn: #534AB7;
      --accent-strong: #534AB7;
      --on-accent: #ffffff;
      --error: #A32D2D;
      --error-bg: #FCEBEB;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1a1a1a;
        --bg-secondary: #1a1a1a;
        --bg-card: #2a2a2a;
        --bg-input: #2a2a2a;
        --text-primary: #f0f0f0;
        --text-secondary: #999;
        --text-tertiary: #666;
        --border: #3a3a3a;
        --border-strong: #444;
        --accent-bg: #2d2b4a;
        --accent-border: #7F77DD;
        --accent-text: #AFA9EC;
        --accent-btn: #6860cc;
        --error: #F09595;
        --error-bg: #2a0a0a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 40px 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      background: var(--accent-bg);
      color: var(--accent-strong);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); }
    .sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.5; }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      font-size: 18px;
      text-align: center;
      background: var(--bg-input);
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: 0.05em;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-border);
    }
    input[type="text"]::placeholder { color: var(--text-tertiary); }
    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: var(--accent-btn);
      color: var(--on-accent);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .error {
      font-size: 13px;
      color: var(--error);
      margin-top: 10px;
      display: none;
    }
    .error.show { display: block; }
    .hint {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
{{THEME_HEAD}}
</head>
<body>
<div class="card">
  <div class="theme-scene theme-scene-hero" aria-hidden="true"></div>
  <div class="icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>
  <h1>{{COUPLE_HEADING}}</h1>
  <p class="sub">Enter the passphrase from your invite to view and share photos</p>
    <input type="text" id="phrase" placeholder="passphrase" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="const e=document.getElementById('error'); e.classList.remove('show'); e.textContent=''" />  <button class="btn" onclick="submit()">Enter</button>
  <p class="error" id="error">That's not quite right — check your invite</p>
  <p class="hint">Scanned a QR code and seeing this?<br>Try scanning again or type the passphrase from your invite.</p>
</div>
<script>
  document.getElementById('phrase').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submit();
  });

  async function submit() {
    const val = document.getElementById('phrase').value.trim().toLowerCase();
    const btn = document.querySelector('.btn');
    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
      const res = await fetch('/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passphrase: val })
      });

      const data = await res.json();

      if (data.success) {
        window.location.href = '/';
      } else if (res.status === 429) {
        document.getElementById('error').textContent = 'Too many attempts — try again in a minute.';
        document.getElementById('error').classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Enter';
      } else {
        document.getElementById('error').textContent = "That's not quite right — check your invite";
        document.getElementById('error').classList.add('show');
        document.getElementById('phrase').focus();
        btn.disabled = false;
        btn.textContent = 'Enter';
      }
    } catch (err) {
      document.getElementById('error').classList.add('show');
      document.getElementById('phrase').focus();
      btn.disabled = false;
      btn.textContent = 'Enter';
    }
  }
</script>
</body>
</html>
